<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FahrlehrerKalender NRW</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe5ee;--blue:#2563eb;--night:#9ca3af;--autobahn:#60a5fa;--overland:#fde047;--vac:#f87171;--exam:#86efac;--holiday:#f5d0fe;--school:#fed7aa}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.light{background:#e5e7eb;color:#111827}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 62px)}aside{background:#fff;border-right:1px solid var(--line);padding:14px}.nav{width:100%;border:0;background:transparent;padding:11px;border-radius:9px;text-align:left;font-weight:700;color:#475569;cursor:pointer}.nav.active{background:#eef2ff;color:#1d4ed8}main{padding:20px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:15px}h1{margin:0 0 4px}.sub{color:var(--muted);font-size:14px}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls input{border:1px solid var(--line);border-radius:9px;padding:9px}.seg{display:flex;background:#e8edf5;padding:4px;border-radius:11px}.seg button{border:0;background:transparent;padding:8px 11px;border-radius:8px;font-weight:700;color:#475569}.seg button.active{background:#fff;color:#111827}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.card{padding:15px}.metric{font-size:25px;font-weight:800}.label{font-size:13px;color:var(--muted)}.panel{overflow:hidden}.panelhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.panelbody{padding:14px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#475569}.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px}.event{display:grid;grid-template-columns:105px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:11px;margin-bottom:9px;border-left:6px solid var(--c)}.event strong{display:block}.small{font-size:12px;color:#64748b}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:#64748b;background:#f8fafc}.icon{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer}.month{display:grid;grid-template-columns:repeat(7,1fr)}.dow{text-align:center;padding:8px;font-size:12px;background:#f8fafc;border-bottom:1px solid var(--line)}.day{min-height:110px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day.muted{opacity:.35}.day.today{outline:2px solid var(--blue);outline-offset:-2px}.badge{font-size:10px;font-weight:700;border-radius:5px;padding:3px 5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.year{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.minimonth{border:1px solid var(--line);border-radius:10px;padding:9px}.minigrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.minigrid span{font-size:10px;aspect-ratio:1;display:grid;place-items:center;border-radius:4px}.modalbg{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:18px}.modalbg.open{display:flex}.modal{background:#fff;border-radius:15px;width:min(620px,100%);max-height:90vh;overflow:auto}.mh,.mf{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.mf{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.mb{padding:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:9px;padding:10px}.dur{background:#eff6ff;color:#1d4ed8;padding:10px;border-radius:8px;font-weight:700}.mobile{display:none}.empty{text-align:center;color:#64748b;padding:30px}.toast{position:fixed;right:16px;bottom:80px;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:80}.toast.show{opacity:1}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}.cards{grid-template-columns:repeat(2,1fr)}.year{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:14px 14px 90px}.brand{font-size:0}.brand:after{content:'FP';font-size:18px;background:#fff;color:#111827;padding:9px;border-radius:10px}.desktopStudent{display:none}.mobile{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}.mobile button{flex:1;border:0;background:#fff;padding:8px 3px;font-size:11px;color:#64748b;font-weight:700}.mobile button.active{color:var(--blue)}.event{grid-template-columns:90px 1fr}.event .ea{grid-column:2}.month .day{min-height:86px}.form{grid-template-columns:1fr}.full{grid-column:auto}.year{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand">FahrlehrerKalender NRW</div><div class="actions"><button class="btn light desktopStudent" onclick="openStudent()">+ Fahrschüler</button><button class="btn primary" onclick="openAppt()">+ Termin</button></div></header>
<div class="layout"><aside><button class="nav active" data-page="calendar" onclick="go('calendar')">📅 Kalender</button><button class="nav" data-page="students" onclick="go('students')">👤 Fahrschüler</button><button class="nav" data-page="vacation" onclick="go('vacation')">🏖️ Urlaub</button><button class="nav" data-page="settings" onclick="go('settings')">⚙️ Einstellungen</button></aside><main id="main"></main></div>
<nav class="mobile"><button class="mnav active" data-page="calendar" onclick="go('calendar')">📅<br>Kalender</button><button class="mnav" data-page="students" onclick="go('students')">👤<br>Fahrschüler</button><button class="mnav" data-page="vacation" onclick="go('vacation')">🏖️<br>Urlaub</button><button class="mnav" data-page="settings" onclick="go('settings')">⚙️<br>Einstellungen</button></nav>
<div class="modalbg" id="appt"><div class="modal"><div class="mh"><b>Termin</b><button class="icon" onclick="closeM('appt')">✕</button></div><div class="mb"><input type="hidden" id="aid"><div class="form"><div class="field full"><label>Fahrschüler</label><select id="astudent"></select></div><div class="field"><label>Datum</label><input type="date" id="adate"></div><div class="field"><label>Beginn</label><input type="time" id="atime" value="08:00"></div><div class="field"><label>Terminart</label><select id="atype" onchange="preview()"><option value="normal">Normale Fahrstunde</option><option value="overland">Überland</option><option value="autobahn">Autobahn</option><option value="night">Nachtfahrt</option><option value="exam">Prüfung</option></select></div><div class="field"><label>UE</label><select id="aue" onchange="preview()"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="field full"><label>Dauer</label><div class="dur" id="dur">2 UE = 90 Min.</div></div><div class="field full"><label>Notiz</label><textarea id="anote"></textarea></div></div></div><div class="mf"><button class="btn light" onclick="closeM('appt')">Abbrechen</button><button class="btn primary" onclick="saveAppt()">Speichern</button></div></div></div>
<div class="modalbg" id="student"><div class="modal"><div class="mh"><b>Fahrschüler</b><button class="icon" onclick="closeM('student')">✕</button></div><div class="mb"><input type="hidden" id="sid"><div class="form"><div class="field"><label>Vorname</label><input id="sf"></div><div class="field"><label>Nachname</label><input id="sl"></div><div class="field"><label>Telefon</label><input id="sp"></div><div class="field"><label>Führerscheinklasse</label><input id="sc" placeholder="B / BE"></div><div class="field full"><label>Notiz</label><textarea id="sn"></textarea></div></div></div><div class="mf"><button class="btn light" onclick="closeM('student')">Abbrechen</button><button class="btn primary" onclick="saveStudent()">Speichern</button></div></div></div>
<div class="modalbg" id="vac"><div class="modal"><div class="mh"><b>Urlaub</b><button class="icon" onclick="closeM('vac')">✕</button></div><div class="mb"><div class="form"><div class="field"><label>Von</label><input type="date" id="vf"></div><div class="field"><label>Bis</label><input type="date" id="vt"></div><div class="field full"><label>Bezeichnung</label><input id="vl" value="Urlaub"></div></div></div><div class="mf"><button class="btn light" onclick="closeM('vac')">Abbrechen</button><button class="btn primary" onclick="saveVac()">Speichern</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='fahrlehrerkalender_v1', C={normal:'#dbeafe',night:'#9ca3af',autobahn:'#60a5fa',overland:'#fde047',vac:'#f87171',exam:'#86efac'}, TL={normal:'Normale Fahrstunde',night:'Nachtfahrt',autobahn:'Autobahn',overland:'Überland',exam:'Prüfung'}, MONTH=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'], DOW=['Mo','Di','Mi','Do','Fr','Sa','So'];
const SCHOOL=[['Weihnachtsferien','2025-12-22','2026-01-06'],['Osterferien','2026-03-30','2026-04-11'],['Pfingstferien','2026-05-26','2026-05-26'],['Sommerferien','2026-07-20','2026-09-01'],['Herbstferien','2026-10-17','2026-10-31'],['Weihnachtsferien','2026-12-23','2027-01-06'],['Osterferien','2027-03-22','2027-04-03'],['Pfingstferien','2027-05-18','2027-05-18'],['Sommerferien','2027-07-19','2027-08-31'],['Herbstferien','2027-10-23','2027-11-06'],['Weihnachtsferien','2027-12-24','2028-01-08'],['Osterferien','2028-04-10','2028-04-22'],['Sommerferien','2028-07-10','2028-08-22'],['Herbstferien','2028-10-23','2028-11-04'],['Weihnachtsferien','2028-12-21','2029-01-05'],['Osterferien','2029-03-26','2029-04-07'],['Pfingstferien','2029-05-22','2029-05-22'],['Sommerferien','2029-07-02','2029-08-14'],['Herbstferien','2029-10-15','2029-10-27'],['Weihnachtsferien','2029-12-20','2030-01-04'],['Osterferien','2030-04-15','2030-04-27']];
let data=JSON.parse(localStorage.getItem(KEY)||'{"students":[],"appointments":[],"vacations":[]}'), page='calendar', view='day', sel=today();
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function pad(n){return String(n).padStart(2,'0')}function today(){let d=new Date;return iso(d)}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function pdate(s){let[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function min(t){let[h,m]=t.split(':').map(Number);return h*60+m}function tmin(m){return pad(Math.floor(m/60))+':'+pad(m%60)}function dur(a){return a.type==='exam'?60:Number(a.ue)*45}function end(a){return tmin(min(a.time)+dur(a))}function sname(i){let s=data.students.find(x=>x.id===i);return s?s.first+' '+s.last:'Ohne Fahrschüler'}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s){return pdate(s).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function openM(i){document.getElementById(i).classList.add('open')}function closeM(i){document.getElementById(i).classList.remove('open')}
function easter(y){let f=Math.floor,G=y%19,Cc=f(y/100),H=(Cc-f(Cc/4)-f((8*Cc+13)/25)+19*G+15)%30,I=H-f(H/28)*(1-f(29/(H+1))*f((21-G)/11)),J=(y+f(y/4)+I+2-Cc+f(Cc/4))%7,L=I-J,m=3+f((L+40)/44),d=L+28-31*f(m/4);return new Date(y,m-1,d)}function hol(y){let e=easter(y);return [['Neujahr',new Date(y,0,1)],['Karfreitag',add(e,-2)],['Ostermontag',add(e,1)],['Tag der Arbeit',new Date(y,4,1)],['Christi Himmelfahrt',add(e,39)],['Pfingstmontag',add(e,50)],['Fronleichnam',add(e,60)],['Tag der Deutschen Einheit',new Date(y,9,3)],['Allerheiligen',new Date(y,10,1)],['1. Weihnachtstag',new Date(y,11,25)],['2. Weihnachtstag',new Date(y,11,26)]].map(x=>({name:x[0],date:iso(x[1])}))}function holiday(s){return hol(+s.slice(0,4)).find(x=>x.date===s)}function school(s){return SCHOOL.find(x=>s>=x[1]&&s<=x[2])}function vac(s){return data.vacations.find(x=>s>=x.from&&s<=x.to)}function apps(s){return data.appointments.filter(x=>x.date===s).sort((a,b)=>a.time.localeCompare(b.time))}
function go(p){page=p;document.querySelectorAll('.nav,.mnav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}function shift(n){let d=pdate(sel);if(view==='day')d=add(d,n);if(view==='month')d=new Date(d.getFullYear(),d.getMonth()+n,1);if(view==='year')d=new Date(d.getFullYear()+n,d.getMonth(),1);sel=iso(d);render()}
function render(){let m=document.getElementById('main');m.innerHTML=page==='calendar'?calendar():page==='students'?students():page==='vacation'?vacations():settings()}
function calendar(){let a=apps(sel),ue=a.filter(x=>x.type!=='exam').reduce((s,x)=>s+Number(x.ue),0),mins=a.reduce((s,x)=>s+dur(x),0);return `<div class="head"><div><h1>${view==='day'?'Tagesplan':view==='month'?'Monatsplan':'Jahresplan'}</h1><div class="sub">${fmt(sel)}</div></div><div class="controls"><button class="btn light" onclick="shift(-1)">‹</button><input type="date" value="${sel}" onchange="sel=this.value;render()"><button class="btn light" onclick="sel=today();render()">Heute</button><button class="btn light" onclick="shift(1)">›</button><div class="seg"><button class="${view==='day'?'active':''}" onclick="view='day';render()">Tag</button><button class="${view==='month'?'active':''}" onclick="view='month';render()">Monat</button><button class="${view==='year'?'active':''}" onclick="view='year';render()">Jahr</button></div></div></div>${view==='day'?`<div class="cards"><div class="card"><div class="label">Termine heute</div><div class="metric">${a.length}</div></div><div class="card"><div class="label">Fahr-UE</div><div class="metric">${ue}</div></div><div class="card"><div class="label">Geplante Zeit</div><div class="metric">${Math.floor(mins/60)}:${pad(mins%60)} h</div></div><div class="card"><div class="label">Prüfungen</div><div class="metric">${a.filter(x=>x.type==='exam').length}</div></div></div>`:''}<div class="panel"><div class="panelhead"><b>${view==='day'?fmt(sel):view==='month'?MONTH[pdate(sel).getMonth()]+' '+pdate(sel).getFullYear():pdate(sel).getFullYear()}</b><div class="legend"><span><i class="dot" style="background:${C.night}"></i>Nacht</span><span><i class="dot" style="background:${C.autobahn}"></i>Autobahn</span><span><i class="dot" style="background:${C.overland}"></i>Überland</span><span><i class="dot" style="background:${C.vac}"></i>Urlaub</span></div></div>${view==='day'?day():view==='month'?month():year()}</div>`}
function day(){let out='',h=holiday(sel),s=school(sel),v=vac(sel);if(h)out+=`<div class="event" style="--c:#d946ef;background:#fae8ff"><b>Feiertag</b><div><strong>${h.name}</strong><span class="small">NRW</span></div></div>`;if(s)out+=`<div class="event" style="--c:#f97316;background:#ffedd5"><b>Ferien</b><div><strong>${s[0]}</strong><span class="small">NRW</span></div></div>`;if(v)out+=`<div class="event" style="--c:${C.vac};background:#fee2e2"><b>Urlaub</b><div><strong>${esc(v.label)}</strong></div></div>`;let a=apps(sel);out+=a.map(x=>`<div class="event" style="--c:${C[x.type]};background:${C[x.type]}44"><b>${x.time}–${end(x)}</b><div><strong>${esc(sname(x.studentId))}</strong><span class="small">${TL[x.type]} · ${x.type==='exam'?'60 Min.':x.ue+' UE'}</span></div><div class="ea"><button class="icon" onclick="editAppt('${x.id}')">✎</button> <button class="icon" onclick="delAppt('${x.id}')">🗑</button></div></div>`).join('');return `<div class="panelbody">${out||'<div class="empty">Noch keine Termine.<br><br><button class="btn primary" onclick="openAppt()">+ Termin anlegen</button></div>'}</div>`}
function monday(d){let w=(d.getDay()+6)%7;return add(d,-w)}function month(){let d=pdate(sel),y=d.getFullYear(),mo=d.getMonth(),start=monday(new Date(y,mo,1)),cells='';for(let i=0;i<42;i++){let x=add(start,i),ds=iso(x),a=apps(ds),h=holiday(ds),s=school(ds),v=vac(ds);cells+=`<div class="day ${x.getMonth()!==mo?'muted':''} ${ds===today()?'today':''}" ondblclick="sel='${ds}';openAppt()"><b>${x.getDate()}</b>${h?`<div class="badge" style="background:#fae8ff">${h.name}</div>`:''}${s?`<div class="badge" style="background:#ffedd5">${s[0]}</div>`:''}${v?`<div class="badge" style="background:#fecaca">${esc(v.label)}</div>`:''}${a.slice(0,3).map(z=>`<div class="badge" style="background:${C[z.type]}">${z.time} ${esc(sname(z.studentId))}</div>`).join('')}</div>`}return `<div class="month">${DOW.map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>`}
function year(){let y=pdate(sel).getFullYear(),out='';for(let mo=0;mo<12;mo++){let start=monday(new Date(y,mo,1)),cells='';for(let i=0;i<42;i++){let d=add(start,i),ds=iso(d),style=d.getMonth()!==mo?'opacity:.25;':'';if(vac(ds))style+='background:#fecaca;';else if(holiday(ds))style+='background:#fae8ff;';else if(school(ds))style+='background:#ffedd5;';if(apps(ds).length)style+='box-shadow:inset 0 -3px 0 #2563eb;';cells+=`<span style="${style}" onclick="sel='${ds}';view='day';render()">${d.getDate()}</span>`}out+=`<div class="minimonth"><b>${MONTH[mo]}</b><div class="minigrid">${DOW.map(x=>`<span><b>${x}</b></span>`).join('')}${cells}</div></div>`}return `<div class="panelbody"><div class="year">${out}</div></div>`}
function students(){return `<div class="head"><div><h1>Fahrschüler</h1><div class="sub">${data.students.length} angelegt</div></div><button class="btn primary" onclick="openStudent()">+ Fahrschüler</button></div><div class="panel tablewrap"><table><thead><tr><th>Name</th><th>Klasse</th><th>Telefon</th><th></th></tr></thead><tbody>${data.students.length?data.students.map(s=>`<tr><td><b>${esc(s.first)} ${esc(s.last)}</b></td><td>${esc(s.cls||'–')}</td><td>${esc(s.phone||'–')}</td><td><button class="icon" onclick="editStudent('${s.id}')">✎</button> <button class="icon" onclick="delStudent('${s.id}')">🗑</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Noch keine Fahrschüler.</td></tr>'}</tbody></table></div>`}
function vacations(){return `<div class="head"><div><h1>Urlaub</h1><div class="sub">Urlaub wird rot markiert.</div></div><button class="btn primary" onclick="openVac()">+ Urlaub</button></div><div class="panel tablewrap"><table><thead><tr><th>Bezeichnung</th><th>Von</th><th>Bis</th><th></th></tr></thead><tbody>${data.vacations.length?data.vacations.map(v=>`<tr><td><b>${esc(v.label)}</b></td><td>${v.from}</td><td>${v.to}</td><td><button class="icon" onclick="delVac('${v.id}')">🗑</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">Noch kein Urlaub.</td></tr>'}</tbody></table></div>`}
function settings(){return `<div class="head"><div><h1>Einstellungen</h1><div class="sub">Daten werden lokal im Browser gespeichert.</div></div></div><div class="panel"><div class="panelbody"><p><b>Farben:</b> Nacht grau, Autobahn blau, Überland gelb, Urlaub rot.</p><p class="sub">NRW-Schulferien sind bis 2029/30 hinterlegt. Gesetzliche Feiertage werden automatisch berechnet.</p><button class="btn light" onclick="exportData()">Backup exportieren</button></div></div>`}
function fillStudents(){let e=document.getElementById('astudent');e.innerHTML='<option value="">Bitte auswählen</option>'+data.students.map(s=>`<option value="${s.id}">${esc(s.first)} ${esc(s.last)}</option>`).join('')}function openAppt(a){fillStudents();aid.value=a?.id||'';astudent.value=a?.studentId||'';adate.value=a?.date||sel;atime.value=a?.time||'08:00';atype.value=a?.type||'normal';aue.value=a?.ue||2;anote.value=a?.note||'';preview();openM('appt')}function preview(){if(atype.value==='exam'){aue.disabled=true;dur.textContent='Prüfung = 60 Minuten'}else{aue.disabled=false;dur.textContent=aue.value+' UE = '+(+aue.value*45)+' Min.'}}function saveAppt(){if(!astudent.value)return toast('Bitte Fahrschüler auswählen.');let a={id:aid.value||id(),studentId:astudent.value,date:adate.value,time:atime.value,type:atype.value,ue:+aue.value,note:anote.value.trim()},start=min(a.time),finish=start+dur(a),conf=data.appointments.find(x=>x.id!==a.id&&x.date===a.date&&start<min(x.time)+dur(x)&&finish>min(x.time));if(vac(a.date)&&!confirm('Termin liegt im Urlaub. Trotzdem speichern?'))return;if(conf&&!confirm('Terminüberschneidung. Trotzdem speichern?'))return;data.appointments=aid.value?data.appointments.map(x=>x.id===a.id?a:x):[...data.appointments,a];save();sel=a.date;closeM('appt');go('calendar');toast('Termin gespeichert.')}function editAppt(i){openAppt(data.appointments.find(x=>x.id===i))}function delAppt(i){if(confirm('Termin löschen?')){data.appointments=data.appointments.filter(x=>x.id!==i);save();render()}}
function openStudent(s){sid.value=s?.id||'';sf.value=s?.first||'';sl.value=s?.last||'';sp.value=s?.phone||'';sc.value=s?.cls||'';sn.value=s?.note||'';openM('student')}function saveStudent(){if(!sf.value.trim()||!sl.value.trim())return toast('Vorname und Nachname sind Pflicht.');let s={id:sid.value||id(),first:sf.value.trim(),last:sl.value.trim(),phone:sp.value.trim(),cls:sc.value.trim(),note:sn.value.trim()};data.students=sid.value?data.students.map(x=>x.id===s.id?s:x):[...data.students,s];save();closeM('student');render();toast('Fahrschüler gespeichert.')}function editStudent(i){openStudent(data.students.find(x=>x.id===i))}function delStudent(i){if(data.appointments.some(x=>x.studentId===i))return toast('Fahrschüler hat noch Termine.');if(confirm('Fahrschüler löschen?')){data.students=data.students.filter(x=>x.id!==i);save();render()}}
function openVac(){vf.value=sel;vt.value=sel;vl.value='Urlaub';openM('vac')}function saveVac(){if(!vf.value||!vt.value||vt.value<vf.value)return toast('Ungültiger Zeitraum.');data.vacations.push({id:id(),from:vf.value,to:vt.value,label:vl.value.trim()||'Urlaub'});save();closeM('vac');render()}function delVac(i){if(confirm('Urlaub löschen?')){data.vacations=data.vacations.filter(x=>x.id!==i);save();render()}}function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fahrlehrerkalender-backup-'+today()+'.json';a.click()}
render();
</script>
</body></html>
