<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>FahrlehrerKalender NRW</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="stage-colors.css">
<link rel="stylesheet" href="student-management.css">
<link rel="stylesheet" href="pruefgebiet.css">
<link rel="stylesheet" href="office-integration.css">
</head>
<body>
<header class="top">
  <div class="brand">FahrlehrerKalender NRW</div>
  <div class="actions">
    <button class="btn light desktopStudent" onclick="openStudent()">+ Fahrschüler</button>
    <button class="btn secondary" onclick="openPrivate()">+ Privat</button>
    <button class="btn primary" onclick="openAppt()">+ Termin</button>
  </div>
</header>
<div class="layout">
  <aside>
    <button class="nav active" data-page="calendar" onclick="go('calendar')">📅 Kalender</button>
    <button class="nav" data-page="students" onclick="go('students')">👤 Fahrschüler</button>
    <button class="nav" data-page="office" onclick="go('office')">📚 Unterricht & Büro</button>
    <button class="nav" data-page="practice" onclick="go('practice')">🛣️ Prüfgebiet</button>
    <button class="nav" data-page="vacation" onclick="go('vacation')">🏖️ Urlaub</button>
    <button class="nav" data-page="settings" onclick="go('settings')">⚙️ Einstellungen</button>
  </aside>
  <main id="main"></main>
</div>
<nav class="mobile">
  <button class="mnav active" data-page="calendar" onclick="go('calendar')">📅<br>Kalender</button>
  <button class="mnav" data-page="students" onclick="go('students')">👤<br>Schüler</button>
  <button class="mnav" data-page="office" onclick="go('office')">📚<br>Büro</button>
  <button class="mnav" data-page="practice" onclick="go('practice')">🛣️<br>Gebiet</button>
  <button class="mnav" data-page="vacation" onclick="go('vacation')">🏖️<br>Urlaub</button>
  <button class="mnav" data-page="settings" onclick="go('settings')">⚙️<br>Setup</button>
</nav>

<div class="modalbg" id="appt"><div class="modal">
  <div class="mh"><b>Fahrtermin</b><button class="icon" onclick="closeM('appt')">✕</button></div>
  <div class="mb"><input type="hidden" id="aid"><div class="form">
    <div class="field full"><label>Fahrschüler</label><select id="astudent"></select></div>
    <div class="field"><label>Datum</label><input type="date" id="adate"></div>
    <div class="field"><label>Beginn</label><input type="time" id="atime" value="08:00" step="900" onchange="preview()"></div>
    <div class="field"><label>Ende</label><input type="time" id="aend" value="09:30" step="900" onchange="preview()"></div>
    <div class="field"><label>Terminart</label><select id="atype" onchange="preview()"><option value="normal">Normale Fahrstunde</option><option value="overland">Überland</option><option value="autobahn">Autobahn</option><option value="night">Nachtfahrt</option><option value="exam">Prüfung</option></select></div>
    <div class="field"><label>Getriebe</label><select id="atransmission"><option value="automatic">Automatik</option><option value="manual">Schalter</option></select></div>
    <div class="field full"><label>Gesamtdauer</label><div class="dur" id="dur">90 Minuten</div></div>
    <div class="field full"><label>Notiz</label><textarea id="anote" rows="3"></textarea></div>
  </div></div>
  <div class="mf"><button class="btn light" onclick="closeM('appt')">Abbrechen</button><button class="btn primary" onclick="saveAppt()">Speichern</button></div>
</div></div>

<div class="modalbg" id="private"><div class="modal">
  <div class="mh"><b>Privater Eintrag</b><button class="icon" onclick="closeM('private')">✕</button></div>
  <div class="mb"><input type="hidden" id="pid"><div class="form">
    <div class="field full"><label>Bezeichnung</label><input id="ptitle" placeholder="z. B. Krankenhaus, Arzttermin, privat"></div>
    <div class="field"><label>Datum</label><input type="date" id="pdate"></div>
    <div class="field"><label>Beginn</label><input type="time" id="ptime" value="08:00"></div>
    <div class="field"><label>Dauer in Minuten</label><input type="number" id="pminutes" min="5" step="5" value="60"></div>
    <div class="field full"><label>Notiz</label><textarea id="pnote" rows="3"></textarea></div>
  </div></div>
  <div class="mf"><button class="btn light" onclick="closeM('private')">Abbrechen</button><button class="btn primary" onclick="savePrivate()">Speichern</button></div>
</div></div>

<div class="modalbg" id="officeModal"><div class="modal">
  <div class="mh"><b>Unterricht / Büro</b><button class="icon" onclick="closeM('officeModal')">✕</button></div>
  <div class="mb"><input type="hidden" id="oid"><div class="form">
    <div class="field"><label>Art</label><select id="otype"><option value="lesson">Unterricht</option><option value="office">Büro</option></select></div>
    <div class="field"><label>Bezeichnung</label><input id="otitle" placeholder="z. B. Theorie Klasse B, Bürozeit"></div>
    <div class="field"><label>Datum</label><input type="date" id="odate"></div>
    <div class="field"><label>Beginn</label><input type="time" id="otime" value="08:00" step="900" onchange="previewOffice()"></div>
    <div class="field"><label>Ende</label><input type="time" id="oend" value="09:30" step="900" onchange="previewOffice()"></div>
    <div class="field full"><label>Gesamtdauer</label><div class="dur" id="odur">Dauer: 1 Std. 30 Min. (90 Min.)</div></div>
    <div class="field full"><label>Notiz</label><textarea id="onote" rows="3"></textarea></div>
  </div></div>
  <div class="mf"><button class="btn light" onclick="closeM('officeModal')">Abbrechen</button><button class="btn primary" onclick="saveOffice()">Speichern</button></div>
</div></div>

<div class="modalbg" id="student"><div class="modal">
  <div class="mh"><b>Fahrschüler</b><button class="icon" onclick="closeM('student')">✕</button></div>
  <div class="mb"><input type="hidden" id="sid"><div class="form">
    <div class="field"><label>Vorname</label><input id="sf"></div>
    <div class="field"><label>Nachname</label><input id="sl"></div>
    <div class="field"><label>Telefon</label><input id="sp"></div>
    <div class="field"><label>Führerscheinklasse</label><input id="sc" placeholder="B / BE"></div>
    <div class="field full"><label>Ausbildungsstufe</label><select id="sstage"><option value="Grundstufe">Grundstufe</option><option value="Aufbaustufe">Aufbaustufe</option><option value="Leistungsstufe">Leistungsstufe</option><option value="Reife- und Teststufe">Reife- und Teststufe</option></select></div>
    <div class="field full"><label>Notiz</label><textarea id="sn" rows="3"></textarea></div>
  </div></div>
  <div class="mf"><button class="btn light" onclick="closeM('student')">Abbrechen</button><button class="btn primary" onclick="saveStudent()">Speichern</button></div>
</div></div>

<div class="modalbg" id="studentHistoryModal"><div class="modal">
  <div class="mh"><b id="historyTitle">Alle Termine</b><button class="icon" onclick="closeM('studentHistoryModal')">✕</button></div>
  <div class="mb tablewrap"><table><thead><tr><th>Datum / Zeit</th><th>Termin</th><th>Notiz</th></tr></thead><tbody id="historyBody"></tbody></table></div>
  <div class="mf"><button class="btn light" onclick="closeM('studentHistoryModal')">Schließen</button></div>
</div></div>

<div class="modalbg" id="vac"><div class="modal">
  <div class="mh"><b>Urlaub</b><button class="icon" onclick="closeM('vac')">✕</button></div>
  <div class="mb"><div class="form">
    <div class="field"><label>Von</label><input type="date" id="vf"></div>
    <div class="field"><label>Bis</label><input type="date" id="vt"></div>
    <div class="field full"><label>Bezeichnung</label><input id="vl" value="Urlaub"></div>
  </div></div>
  <div class="mf"><button class="btn light" onclick="closeM('vac')">Abbrechen</button><button class="btn primary" onclick="saveVac()">Speichern</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script src="enhancements.js"></script>
<script src="stage-enhancements.js"></script>
<script src="exam-duration-fix.js"></script>
<script src="student-name-enhancements.js"></script>
<script src="student-management-enhancements.js"></script>
<script src="duration-interval-enhancements.js"></script>
<script src="pruefgebiet-integration.js"></script>
<script src="date-filter-fix.js"></script>
<script src="office-integration.js"></script>
<script src="student-appointment-history.js"></script>
</body>
</html>
